services:
  db:
    image: postgres:16-alpine
    container_name: myday-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: myday
      POSTGRES_USER: myday
      POSTGRES_PASSWORD: myday_local_password
    ports:
      - "5432:5432"
    volumes:
      - myday_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myday -d myday"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  myday_pgdata:
