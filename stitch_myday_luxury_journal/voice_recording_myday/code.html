<script>
  (function() {
    let seconds = 48.2;
    let isPaused = false;
    const timeDisplay = document.getElementById('elapsed-time');
    const dbDisplay = document.getElementById('db-level');
    const pauseBtn = document.getElementById('pause-btn');
    const pauseText = document.getElementById('pause-text');
    const waveformStream = document.getElementById('waveform-stream');

    // Chronometer Loop
    setInterval(() => {
      if (!isPaused && timeDisplay) {
        seconds += 0.1;
        const mins = Math.floor(seconds / 60);
        const secs = (seconds % 60).toFixed(1);
        const formatted = `${String(mins).padStart(2, '0')}:${secs.padStart(4, '0')}`;
        timeDisplay.textContent = formatted;

        // Dynamic slight DB oscillation
        if (dbDisplay) {
          const randDb = (-5.5 - Math.random() * 3.5).toFixed(1);
          dbDisplay.textContent = `${randDb} dB`;
        }

        // Slight waveform pulse simulation
        if (waveformStream) {
          const bars = waveformStream.querySelectorAll('span');
          bars.forEach((bar) => {
            if (Math.random() > 0.4) {
              const h = Math.floor(15 + Math.random() * 80);
              bar.style.height = `${h}%`;
            }
          });
        }
      }
    }, 100);

    // Pause toggle
    if (pauseBtn) {
      pauseBtn.addEventListener('click', () => {
        isPaused = !isPaused;
        if (isPaused) {
          pauseText.textContent = 'Resume';
          pauseBtn.classList.add('bg-tertiary-container', 'text-on-tertiary-container');
        } else {
          pauseText.textContent = 'Pause';
          pauseBtn.classList.remove('bg-tertiary-container', 'text-on-tertiary-container');
        }
      });
    }
  })();
