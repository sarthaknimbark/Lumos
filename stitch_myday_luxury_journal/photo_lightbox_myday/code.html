<!-- Micro-interactions Script -->
<script>
    let isZoomed = false;
    let isFavorited = false;
    let isPlayingAudio = false;
    let toastTimeout = null;

    function toggleZoom() {
      const img = document.getElementById('lightbox-image');
      const reticle = document.getElementById('reticle');
      isZoomed = !isZoomed;
      if (isZoomed) {
        img.classList.remove('cursor-zoom-in');
        img.classList.add('cursor-zoom-out', 'scale-150');
        if (reticle) reticle.classList.add('opacity-0');
      } else {
        img.classList.remove('cursor-zoom-out', 'scale-150');
        img.classList.add('cursor-zoom-in');
        if (reticle) reticle.classList.remove('opacity-0');
      }
    }

    function toggleFavorite() {
      isFavorited = !isFavorited;
      const btn = document.getElementById('fav-btn');
      const icon = document.getElementById('fav-icon');
      if (isFavorited) {
        btn.classList.remove('bg-surface-container', 'text-on-surface-variant');
        btn.classList.add('bg-secondary', 'text-on-secondary');
        icon.style.fontVariationSettings = "'FILL' 1";
        triggerToast("Saved to Archival Favorites");
      } else {
        btn.classList.add('bg-surface-container', 'text-on-surface-variant');
        btn.classList.remove('bg-secondary', 'text-on-secondary');
        icon.style.fontVariationSettings = "'FILL' 0";
        triggerToast("Removed from Favorites");
      }
    }

    function toggleVoicePlayback() {
      isPlayingAudio = !isPlayingAudio;
      const icon = document.getElementById('voice-icon');
      const timer = document.getElementById('audio-timer');
      if (isPlayingAudio) {
        icon.innerText = 'pause';
        timer.innerText = '00:07';
        triggerToast("Playing field acoustic note");
      } else {
        icon.innerText = 'play_arrow';
        timer.innerText = '00:14';
      }
    }

    function copyCoordinates() {
      navigator.clipboard ? navigator.clipboard.writeText("52.5069° N, 13.3676° E") : null;
      triggerToast("Geotag copied: 52.5069° N, 13.3676° E");
    }

    function downloadMaster() {
      triggerToast("Preparing uncompressed DNG archive...");
    }

    function toggleDetailsSheet() {
      const sheet = document.getElementById('details-sheet');
      sheet.classList.toggle('translate-y-8');
      sheet.classList.toggle('opacity-90');
    }

    function triggerToast(message) {
      const toast = document.getElementById('lightbox-toast');
      const toastText = document.getElementById('toast-text');
      if (!toast || !toastText) return;
      
      toastText.innerText = message;
      toast.classList.remove('opacity-0', '-translate-y-6');
      toast.classList.add('opacity-100', 'translate-y-0');

      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.add('opacity-0', '-translate-y-6');
        toast.classList.remove('opacity-100', 'translate-y-0');
      }, 2400);
    }
  </script>
